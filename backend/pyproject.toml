[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default is the required idiom, not a bug
    "UP042", # str+enum.Enum (not enum.StrEnum) is the pattern skills/DATABASE.md uses
    "UP017", # datetime.UTC alias is a cosmetic 3.11 preference, not worth chasing here
]
